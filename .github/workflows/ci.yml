name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:deps
      - run: pnpm typecheck
      - run: pnpm test
      # `pnpm build` runs apps/web's prebuild -> scripts/download-wheels.mjs,
      # which fetches nine sha256-pinned wheels from files.pythonhosted.org and
      # throws E_WHEEL_FETCH on any hiccup — a live PyPI dependency that reds
      # unrelated PRs. Cache the staged wheels keyed on the pin file: on a hit
      # the script only re-verifies the sha256s and fetches nothing; editing a
      # pin changes the key and takes the full download path, so a cache can
      # never serve bytes that do not match the pins.
      - uses: actions/cache@v4
        with:
          path: apps/web/public/wheels
          key: web-wheels-${{ hashFiles('apps/web/wheels.json') }}
      - run: pnpm build
